<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiny Ecosystem</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1d2026;
    --panel-2: #262a32;
    --text: #e8e6e1;
    --muted: #9aa0a8;
    --accent: #7fc97f;
    --border: #333842;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }
  #worldWrap {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
  }
  #world {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    border-radius: 6px;
    touch-action: manipulation;
  }
  #panel {
    flex: 0 0 300px;
    background: var(--panel);
    border-left: 1px solid var(--border);
    padding: 14px;
    overflow-y: auto;
  }
  h1 { font-size: 18px; margin: 0 0 12px; }
  h1 span { color: var(--accent); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; }
  .stat { background: var(--panel-2); border-radius: 6px; padding: 6px 8px; }
  .stat b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
  .stat small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
  button, input {
    font: inherit;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  input[type=number] { width: 90px; }
  label { color: var(--muted); font-size: 12px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 14px; }

  /* iPad portrait / narrow screens: panel moves under the world */
  @media (orientation: portrait), (max-width: 760px) {
    body { flex-direction: column; overflow-y: auto; height: auto; min-height: 100vh; }
    #worldWrap { flex: 0 0 auto; }
    #panel { flex: 1 0 auto; border-left: none; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>
  <div id="worldWrap"><canvas id="world"></canvas></div>

  <aside id="panel">
    <h1>Tiny <span>Ecosystem</span></h1>

    <div class="stats">
      <div class="stat"><small>Tick</small><b id="sTick">0</b></div>
      <div class="stat"><small>Year</small><b id="sYear">0</b></div>
      <div class="stat"><small>Season</small><b id="sSeason">–</b></div>
      <div class="stat"><small>Plant food</small><b id="sFood">0</b></div>
      <div class="stat"><small>Population</small><b id="sPop">0</b></div>
      <div class="stat"><small>Avg energy</small><b id="sEnergy">–</b></div>
      <div class="stat" style="grid-column: span 2"><small>Deaths</small><b id="sDeaths" style="font-size:13px">–</b></div>
    </div>

    <div class="row">
      <button id="btnPlay">▶ Play</button>
      <button id="btnStep">Step</button>
    </div>
    <div class="row">
      <label for="inSeed">Seed</label>
      <input id="inSeed" type="number" value="42">
      <button id="btnNew">New world</button>
    </div>

    <p class="note">Step 2: creatures. 120 plant eaters wander, sense food up to <i>sense</i> tiles away,
      eat, and burn energy. Brighter = more energy. No breeding yet, so they all die of old age
      within 1,500 ticks. Breeding arrives in step 3.</p>
  </aside>

<script>
"use strict";
const APP_VERSION = "0.2.0";

/* ================= Seeded random (mulberry32) ================= */
// All randomness in the sim must come from here. Never Math.random().
function mulberry32(seed) {
  let a = seed >>> 0;
  const rng = function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  rng.getState = () => a;
  rng.setState = (s) => { a = s >>> 0; };
  return rng;
}

/* ================= Tileable value noise ================= */
// Wraps at the edges, just like the world, so there is no seam.
function makeFertility(W, H, rng) {
  const out = new Float32Array(W * H);
  const octaves = [
    { cells: 4, amp: 1.0 },
    { cells: 8, amp: 0.5 },
    { cells: 16, amp: 0.25 },
    { cells: 32, amp: 0.12 },
  ];
  let total = 0;
  for (const o of octaves) total += o.amp;

  const smooth = (t) => t * t * (3 - 2 * t);
  for (const o of octaves) {
    const cx = o.cells, cy = Math.max(2, Math.round(o.cells * H / W));
    const lattice = new Float32Array(cx * cy);
    for (let i = 0; i < lattice.length; i++) lattice[i] = rng();
    for (let y = 0; y < H; y++) {
      const fy = (y / H) * cy, y0 = Math.floor(fy), ty = smooth(fy - y0);
      const r0 = (y0 % cy) * cx, r1 = ((y0 + 1) % cy) * cx;
      for (let x = 0; x < W; x++) {
        const fx = (x / W) * cx, x0 = Math.floor(fx), tx = smooth(fx - x0);
        const c0 = x0 % cx, c1 = (x0 + 1) % cx;
        const a = lattice[r0 + c0], b = lattice[r0 + c1];
        const c = lattice[r1 + c0], d = lattice[r1 + c1];
        const v = (a + (b - a) * tx) * (1 - ty) + (c + (d - c) * tx) * ty;
        out[y * W + x] += v * o.amp;
      }
    }
  }
  // Normalise to 0..1, then stretch contrast so we get clear patches and deserts.
  let mn = Infinity, mx = -Infinity;
  for (let i = 0; i < out.length; i++) { const v = out[i] / total; out[i] = v; if (v < mn) mn = v; if (v > mx) mx = v; }
  for (let i = 0; i < out.length; i++) {
    let v = (out[i] - mn) / (mx - mn);
    v = smooth(Math.min(1, Math.max(0, (v - 0.25) / 0.6)));
    out[i] = v;
  }
  return out;
}

/* ================= Settings ================= */
const DEFAULTS = {
  seed: 42,
  world: [200, 140],
  startPop: 120,
  regrowRate: 0.004,      // food per tick at full fertility, average season
  seasons: true,
  yearLength: 2000,       // ticks per year
  seasonAmp: 0.4,         // ±40%
};

/* Energy tuning (not user settings) */
const TUNE = {
  costScale: 0.05,        // multiplies the whole cost formula
  base: 0.4,              // base in: base + size×0.6 + speed²×size×0.4 + sense×0.02
  energyPerSize: 10,      // max energy = size × this
  startEnergy: 0.5,       // newborns of the first generation start at this share of max
  maxAge: 1500,
  corpseFood: 0.3,        // plant food left on the tile per unit of size
};

/* ================= Genes ================= */
const GENES = {
  size:    [0.5, 3],
  speed:   [0.2, 2],
  sense:   [2, 12],
  diet:    [0, 1],
  fear:    [0, 1],
  breedAt: [0.4, 0.95],
  wander:  [0, 1],
  hue:     [0, 360],
};
const GENE_NAMES = Object.keys(GENES);
const STARTER = { size: 1, speed: 1, sense: 5, diet: 0.05, fear: 0.5, breedAt: 0.7, wander: 0.3 };

class Creature {
  constructor(id, x, y, genes, energy, heading) {
    this.id = id;
    this.x = x; this.y = y;
    this.g = genes;
    this.heading = heading;
    this.age = 0;
    this.maxEnergy = genes.size * TUNE.energyPerSize;
    this.energy = Math.min(energy, this.maxEnergy);
    const { size, speed, sense } = genes;
    this.cost = TUNE.costScale * (TUNE.base + size * 0.6 + speed * speed * size * 0.4 + sense * 0.02);
  }
}

// 8 fixed look directions; each is sampled at 3 distances.
const DIRS = [];
for (let d = 0; d < 8; d++) DIRS.push([Math.cos(d * Math.PI / 4), Math.sin(d * Math.PI / 4)]);
const LOOK = [0.34, 0.67, 1];

/* ================= Simulation ================= */
class Sim {
  constructor(settings) {
    this.settings = Object.assign({}, DEFAULTS, settings);
    const [W, H] = this.settings.world;
    this.W = W; this.H = H;
    this.rng = mulberry32(this.settings.seed);
    this.tick = 0;
    this.fertility = makeFertility(W, H, this.rng);
    this.food = new Float32Array(W * H);
    // Start each tile part-way to its fertile maximum.
    for (let i = 0; i < this.food.length; i++) this.food[i] = this.fertility[i] * (0.6 + 0.4 * this.rng());

    this.creatures = [];
    this.nextId = 1;
    this.deaths = { starved: 0, oldAge: 0 };
    this.spawnStarters();
  }

  spawnStarters() {
    const hue = Math.floor(this.rng() * 360);
    for (let n = 0; n < this.settings.startPop; n++) {
      // Drop each starter on a fertile tile (give up after a few tries).
      let x = 0, y = 0;
      for (let t = 0; t < 50; t++) {
        x = this.rng() * this.W; y = this.rng() * this.H;
        if (this.fertility[(y | 0) * this.W + (x | 0)] > 0.5) break;
      }
      const genes = Object.assign({}, STARTER, { hue });
      const c = new Creature(this.nextId++, x, y, genes, 0, this.rng() * Math.PI * 2);
      c.energy = c.maxEnergy * TUNE.startEnergy;
      c.age = Math.floor(this.rng() * TUNE.maxAge * 0.5); // stagger ages so they don't all die at once
      this.creatures.push(c);
    }
  }

  // Look around, pick a heading, move, eat, pay the energy bill.
  act(c) {
    const W = this.W, H = this.H, food = this.food, g = c.g;

    // Sense plant food: sum the 8 directions, nearer samples count more.
    let fx = 0, fy = 0;
    const plantTaste = 1 - g.diet;
    if (plantTaste > 0) {
      for (let d = 0; d < 8; d++) {
        const dx = DIRS[d][0], dy = DIRS[d][1];
        let s = 0;
        for (let k = 0; k < 3; k++) {
          const r = g.sense * LOOK[k];
          let tx = Math.round(c.x + dx * r) % W; if (tx < 0) tx += W;
          let ty = Math.round(c.y + dy * r) % H; if (ty < 0) ty += H;
          s += food[ty * W + tx] / LOOK[k];
        }
        fx += dx * s; fy += dy * s;
      }
      fx *= plantTaste; fy *= plantTaste;
    }

    // Steer: keep some momentum, pull toward food, add wander noise.
    const m = Math.hypot(fx, fy);
    let vx = Math.cos(c.heading) * 0.6, vy = Math.sin(c.heading) * 0.6;
    if (m > 0.05) { vx += fx / m; vy += fy / m; }
    c.heading = Math.atan2(vy, vx) + (this.rng() - 0.5) * Math.PI * g.wander;

    // Move (the world wraps).
    c.x = (c.x + Math.cos(c.heading) * g.speed) % W; if (c.x < 0) c.x += W;
    c.y = (c.y + Math.sin(c.heading) * g.speed) % H; if (c.y < 0) c.y += H;

    // Eat the plant food on this tile.
    const ti = (c.y | 0) * W + (c.x | 0);
    if (plantTaste > 0 && food[ti] > 0) {
      c.energy += food[ti] * plantTaste;
      food[ti] = 0;
      if (c.energy > c.maxEnergy) c.energy = c.maxEnergy;
    }

    c.energy -= c.cost;
    c.age++;
  }

  die(c, cause) {
    const ti = (c.y | 0) * this.W + (c.x | 0);
    this.food[ti] = Math.min(1, this.food[ti] + TUNE.corpseFood * c.g.size);
    this.deaths[cause]++;
  }

  seasonFactor() {
    const s = this.settings;
    if (!s.seasons) return 1;
    return 1 + s.seasonAmp * Math.sin((2 * Math.PI * this.tick) / s.yearLength);
  }

  step() {
    const food = this.food, fert = this.fertility;
    const g = this.settings.regrowRate * this.seasonFactor();
    for (let i = 0; i < food.length; i++) {
      // Tiles regrow toward their own fertile maximum, so deserts stay poor.
      const cap = fert[i], f = food[i] + g * cap;
      food[i] = f > cap ? cap : f;
    }

    // Creatures act in a fixed order (by array position) so runs are reproducible.
    const cs = this.creatures;
    for (let i = 0; i < cs.length; i++) this.act(cs[i]);

    // Remove the dead, keeping order.
    let w = 0;
    for (let i = 0; i < cs.length; i++) {
      const c = cs[i];
      if (c.energy <= 0) this.die(c, "starved");
      else if (c.age >= TUNE.maxAge) this.die(c, "oldAge");
      else cs[w++] = c;
    }
    cs.length = w;

    this.tick++;
  }

  totalFood() {
    let t = 0;
    for (let i = 0; i < this.food.length; i++) t += this.food[i];
    return t;
  }
}

/* ================= Rendering ================= */
const canvas = document.getElementById("world");
const ctx = canvas.getContext("2d");
let tileCanvas, tileCtx, tileImg;

// Sand (no food) -> green (full food)
const SAND = [214, 196, 150], GREEN = [46, 130, 52];
const PALETTE = new Uint32Array(256);
(function buildPalette() {
  const little = new Uint8Array(new Uint32Array([1]).buffer)[0] === 1;
  for (let i = 0; i < 256; i++) {
    const t = i / 255;
    const r = Math.round(SAND[0] + (GREEN[0] - SAND[0]) * t);
    const g = Math.round(SAND[1] + (GREEN[1] - SAND[1]) * t);
    const b = Math.round(SAND[2] + (GREEN[2] - SAND[2]) * t);
    PALETTE[i] = little ? (255 << 24) | (b << 16) | (g << 8) | r : (r << 24) | (g << 16) | (b << 8) | 255;
  }
})();

function setupRender(sim) {
  tileCanvas = document.createElement("canvas");
  tileCanvas.width = sim.W; tileCanvas.height = sim.H;
  tileCtx = tileCanvas.getContext("2d");
  tileImg = tileCtx.createImageData(sim.W, sim.H);
  resize();
}

function resize() {
  if (!sim) return;
  const wrap = document.getElementById("worldWrap");
  const portrait = matchMedia("(orientation: portrait), (max-width: 760px)").matches;
  const availW = wrap.clientWidth - 16;
  const availH = portrait ? window.innerHeight * 0.6 : wrap.clientHeight - 16;
  const scale = Math.max(1, Math.min(availW / sim.W, availH / sim.H));
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = Math.floor(sim.W * scale) + "px";
  canvas.style.height = Math.floor(sim.H * scale) + "px";
  canvas.width = Math.floor(sim.W * scale * dpr);
  canvas.height = Math.floor(sim.H * scale * dpr);
  draw();
}

function draw() {
  const px = new Uint32Array(tileImg.data.buffer);
  const food = sim.food;
  for (let i = 0; i < food.length; i++) px[i] = PALETTE[(food[i] * 255) | 0];
  tileCtx.putImageData(tileImg, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(tileCanvas, 0, 0, canvas.width, canvas.height);

  // Creatures: circles sized by `size`, coloured by `hue`. Meat eaters get a dark ring.
  const s = canvas.width / sim.W;
  ctx.lineWidth = Math.max(1, s * 0.15);
  for (const c of sim.creatures) {
    const r = (0.35 + 0.35 * c.g.size) * s;
    const px = (c.x) * s, py = (c.y) * s;
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.fillStyle = `hsl(${c.g.hue}, 75%, ${35 + 30 * c.energy / c.maxEnergy}%)`;
    ctx.fill();
    ctx.strokeStyle = c.g.diet > 0.6 ? "#111" : "rgba(0,0,0,0.35)";
    ctx.lineWidth = c.g.diet > 0.6 ? Math.max(1.5, s * 0.3) : Math.max(1, s * 0.12);
    ctx.stroke();
  }
}

/* ================= UI ================= */
const $ = (id) => document.getElementById(id);
let sim = null;
let running = false;
const TICKS_PER_FRAME = 4;

function updateStats() {
  $("sTick").textContent = sim.tick.toLocaleString();
  $("sYear").textContent = Math.floor(sim.tick / sim.settings.yearLength);
  const phase = (sim.tick % sim.settings.yearLength) / sim.settings.yearLength;
  $("sSeason").textContent = !sim.settings.seasons ? "off" : ["Spring", "Summer", "Autumn", "Winter"][Math.floor(phase * 4)];
  $("sFood").textContent = (sim.totalFood() / (sim.W * sim.H)).toFixed(2);
  $("sPop").textContent = sim.creatures.length.toLocaleString();
  let e = 0;
  for (const c of sim.creatures) e += c.energy / c.maxEnergy;
  $("sEnergy").textContent = sim.creatures.length ? Math.round(100 * e / sim.creatures.length) + "%" : "–";
  $("sDeaths").textContent = `${sim.deaths.starved} starved · ${sim.deaths.oldAge} old age`;
}

function newWorld() {
  const seed = parseInt($("inSeed").value, 10) || 0;
  sim = new Sim({ seed });
  setupRender(sim);
  updateStats();
}

function loop() {
  if (running) {
    for (let i = 0; i < TICKS_PER_FRAME; i++) sim.step();
    draw();
    updateStats();
  }
  requestAnimationFrame(loop);
}

$("btnPlay").onclick = () => {
  running = !running;
  $("btnPlay").textContent = running ? "⏸ Pause" : "▶ Play";
};
$("btnStep").onclick = () => { sim.step(); draw(); updateStats(); };
$("btnNew").onclick = newWorld;
window.addEventListener("resize", resize);

newWorld();
requestAnimationFrame(loop);
</script>
</body>
</html>
